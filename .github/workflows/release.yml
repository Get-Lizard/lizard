name: Release

# Push a tag like v0.2.0 → signed + notarized DMG on GitHub Releases → Homebrew cask updated.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (without the v), e.g. 0.2.0"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    env:
      VERSION: ${{ github.event.inputs.version || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Normalize version
        run: echo "VERSION=${VERSION#v}" >> "$GITHUB_ENV"

      - name: Select Xcode 26.2
        run: sudo xcode-select -s /Applications/Xcode_26.2.app || xcodebuild -version

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Tools
        run: |
          brew install xcodegen
          xcodebuild -downloadComponent MetalToolchain

      - name: Import the Developer ID certificate
        env:
          CERTIFICATE_P12: ${{ secrets.DEVELOPER_ID_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -hex 16)
          echo "$CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"
          security find-identity -v -p codesigning "$KEYCHAIN"

      - name: App Store Connect API key (notarization)
        env:
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
        run: |
          echo "$NOTARY_KEY_P8" | base64 --decode > "$RUNNER_TEMP/notary.p8"
          echo "NOTARY_KEY_PATH=$RUNNER_TEMP/notary.p8" >> "$GITHUB_ENV"

      - name: Build, sign, notarize, staple
        id: build
        env:
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.NOTARY_ISSUER_ID }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: scripts/release.sh

      # Same disk image under a fixed name, so one link always serves the newest version:
      # https://github.com/Get-Lizard/lizard/releases/latest/download/Lizard.dmg
      - name: Stable-named copy
        run: cp "${{ steps.build.outputs.dmg }}" "$RUNNER_TEMP/Lizard.dmg"

      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: Lizard ${{ env.VERSION }}
          files: |
            ${{ steps.build.outputs.dmg }}
            ${{ runner.temp }}/Lizard.dmg
          generate_release_notes: true

      - name: Update the Homebrew cask
        env:
          TAP_DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
          TAP_REPO: ${{ vars.HOMEBREW_TAP_REPO || 'Get-Lizard/homebrew-tap' }}
          SHA256: ${{ steps.build.outputs.sha256 }}
        run: |
          # Write access to the tap comes from a deploy key on that repo (no personal token).
          KEY="$RUNNER_TEMP/tap_key"
          printf '%s\n' "$TAP_DEPLOY_KEY" > "$KEY" && chmod 600 "$KEY"
          export GIT_SSH_COMMAND="ssh -i $KEY -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
          git clone "git@github.com:${TAP_REPO}.git" tap
          mkdir -p tap/Casks
          sed -e "s/__VERSION__/${VERSION}/g" -e "s/__SHA256__/${SHA256}/g" -e "s#__REPO__#${GITHUB_REPOSITORY}#g" \
            packaging/homebrew/lizard.rb.template > tap/Casks/lizard.rb
          cd tap
          git config user.name "lizard-release-bot"
          git config user.email "lizard-release-bot@users.noreply.github.com"
          git add Casks/lizard.rb
          git commit -m "lizard ${VERSION}" || echo "cask unchanged"
          git push

      - name: Clean up the keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
